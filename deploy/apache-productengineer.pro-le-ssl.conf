# HTTPS vhost for productengineer.pro. certbot generated the first version; this copy adds the API.
# setup-api.sh installs it in /etc/apache2/sites-available/ (keeping a backup of the old file).
# The HTTP vhost only redirects here, so the proxy rules live in this file alone.
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName productengineer.pro
    ServerAlias www.productengineer.pro
    DocumentRoot /var/www/html/productengineer.pro/website/dist

    # One origin: sign-in cookies and OAuth callbacks belong to the apex domain.
    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^www\. [NC]
    RewriteRule ^ https://productengineer.pro%{REQUEST_URI} [R=301,L]

    <Directory /var/www/html/productengineer.pro/website/dist>
        Options -Indexes -MultiViews +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
    </Directory>

    ErrorDocument 404 /404.html

    # Hashed assets never change; pages and data refresh quickly.
    <Directory /var/www/html/productengineer.pro/website/dist/_astro>
        Header set Cache-Control "public, max-age=31536000, immutable"
    </Directory>
    <Directory /var/www/html/productengineer.pro/website/dist/og>
        Header set Cache-Control "public, max-age=86400"
    </Directory>
    <FilesMatch "\.(html|json|xml|txt)$">
        Header set Cache-Control "public, max-age=0, must-revalidate"
    </FilesMatch>

    AddOutputFilterByType DEFLATE text/html text/plain text/css text/javascript application/javascript application/json image/svg+xml application/xml

    # ---- API: accounts, synced progress, OAuth for agents, MCP ------------------------------
    # The Node server (PM2 app "productengineer-api") on 127.0.0.1:8790. It sets its own
    # Cache-Control and CORS headers. flushpackets lets MCP's server-sent events stream.
    ProxyPreserveHost On
    ProxyTimeout 60
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass        /api/   http://127.0.0.1:8790/api/
    ProxyPassReverse /api/   http://127.0.0.1:8790/api/
    ProxyPass        /oauth/ http://127.0.0.1:8790/oauth/
    ProxyPassReverse /oauth/ http://127.0.0.1:8790/oauth/
    ProxyPassMatch   ^/mcp(/public)?$ http://127.0.0.1:8790/mcp$1 flushpackets=on
    ProxyPassMatch   ^/\.well-known/(oauth-authorization-server|oauth-protected-resource(/mcp)?)$ http://127.0.0.1:8790/.well-known/$1

    # The page where people approve agents must never be framed (clickjacking).
    <Location /connect/>
        Header always set X-Frame-Options "DENY"
        Header always set Content-Security-Policy "frame-ancestors 'none'"
    </Location>

    ErrorLog ${APACHE_LOG_DIR}/productengineer-error.log
    CustomLog ${APACHE_LOG_DIR}/productengineer-access.log combined

Include /etc/letsencrypt/options-ssl-apache.conf
SSLCertificateFile /etc/letsencrypt/live/productengineer.pro/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/productengineer.pro/privkey.pem
</VirtualHost>
</IfModule>
