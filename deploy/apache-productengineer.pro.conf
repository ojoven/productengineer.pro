# HTTP vhost for productengineer.pro. setup.sh copies this to /etc/apache2/sites-available/
# and enables it; certbot --apache then adds the HTTPS vhost and the HTTP-to-HTTPS redirect.

<VirtualHost *:80>
    ServerName productengineer.pro
    ServerAlias www.productengineer.pro
    DocumentRoot /var/www/html/productengineer.pro/website/dist

    <Directory /var/www/html/productengineer.pro/website/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectorySlash On
    </Directory>

    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^www\.(.+)$ [NC]
    RewriteRule ^ https://%1%{REQUEST_URI} [R=301,L]

    ErrorDocument 404 /404.html

    # Hashed assets never change; pages and data refresh quickly.
    <LocationMatch "^/_astro/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
    <LocationMatch "^/(og|pagefind)/">
        Header set Cache-Control "public, max-age=86400"
    </LocationMatch>
    <FilesMatch "\.(html|json|xml)$">
        Header set Cache-Control "public, max-age=300"
    </FilesMatch>

    AddOutputFilterByType DEFLATE text/html text/css application/javascript application/json image/svg+xml application/xml

    ErrorLog ${APACHE_LOG_DIR}/productengineer.pro.error.log
    CustomLog ${APACHE_LOG_DIR}/productengineer.pro.access.log combined
</VirtualHost>
