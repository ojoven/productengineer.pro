# Territory: Engineering
# Review batch 4 of 11.

id: engineering
order: 4
name: Engineering
tagline: Build effective systems
question: Can we implement this effectively, correctly, securely and sustainably?
description: >-
  Engineering is the home ground of most product engineers: turning a decision into software
  that works, stays correct as it changes, and can be operated safely. The product angle changes
  the emphasis. Speed of learning matters as much as elegance, and the best technical choice is
  the one that serves the product at its current stage, including AI features that need new
  ways of testing.
expected: >-
  Build the complete technical solution, reason about architecture, verify its behavior, and
  maintain quality without requiring detailed implementation instructions.
capabilities:
  - id: software-development
    name: Software development
    description: >-
      Building the working product across the stack, from interface to server, and keeping
      the code organized as it grows.
    related: [databases]
    resources: [mdn-learn-web, mdn-server-side, twelve-factor]
    skills:
      - id: frontend-development
        name: Frontend development
        summary: Building the interface users see and interact with.
        description: >-
          Frontend work covers HTML, CSS, JavaScript and the frameworks on top. It is where most
          product decisions become visible. Product engineers need enough depth to build polished,
          accessible and fast interfaces without hand-holding.
        related: [frontend-performance, semantic-markup]
        resources: [mdn-learn-web]
      - id: backend-development
        name: Backend development
        summary: Building the server-side logic, data access and integrations.
        description: >-
          The backend handles business rules, persistence, authentication and integrations with
          other systems. It needs to be correct, secure and observable. Product engineers move
          between frontend and backend to deliver a feature end to end.
        related: [api-design, databases]
        resources: [mdn-server-side, twelve-factor]
        tools: [postgresql]
      - id: api-design
        name: API design
        summary: Designing interfaces between systems that are clear and stable.
        description: >-
          An API is a contract other code depends on, so it is hard to change once used. Good APIs
          have consistent naming, clear errors, sensible pagination and versioning. For developer
          products the API is the product.
        related: [system-boundaries, developer-docs]
        resources: [google-aip-121]
      - id: state-management
        name: State management
        summary: Keeping track of data and UI state so the interface stays consistent.
        description: >-
          State management decides where data lives, how it changes and how the UI stays in sync
          with the server. Many bugs come from state stored in two places. Simple, explicit state
          makes features easier to change.
        related: [user-flows, data-consistency]
        resources: [kcd-state]
      - id: async-systems
        name: Asynchronous systems
        summary: Queues, background jobs and events for work that does not happen instantly.
        description: >-
          Emails, imports, AI calls and payments often run asynchronously. Queues and background
          jobs make products more responsive and resilient, but add retries, ordering and failure
          states to think about. Users need feedback about work still in progress.
        related: [resilience, interface-feedback]
        resources: [fowler-event-driven, system-design-primer]
      - id: code-organization
        name: Code organization
        summary: Structuring a codebase so people can find and change things safely.
        description: >-
          Code organization covers folders, modules, naming and where logic lives. A predictable
          structure lets new people and AI agents work in the codebase quickly. Organizing by
          feature often scales better than organizing by technical layer.
        related: [modularity, design-systems]
        resources: [fowler-layering]

  - id: software-architecture
    name: Software architecture
    description: >-
      The large-scale structure of a system and the tradeoffs behind it. Good architecture
      keeps future changes cheap.
    resources: [fowler-monolith-first, nygard-adr, system-design-primer]
    skills:
      - id: modularity
        name: Modularity
        summary: Dividing a system into parts with clear responsibilities.
        description: >-
          A modular system has parts that can be understood, tested and changed separately. Deep
          modules hide a lot of complexity behind a small interface. Modularity is what lets a
          product grow without every change touching everything.
        related: [coupling, code-organization]
        resources: [fowler-layering, fowler-monolith-first]
      - id: separation-of-concerns
        name: Separation of concerns
        summary: Keeping different responsibilities in different places in the code.
        description: >-
          Separating presentation, business logic and data access keeps each easier to change and
          test. Mixing them makes small changes risky. The principle applies at every scale, from a
          function to a whole system.
        related: [modularity, system-boundaries]
        resources: [fowler-layering]
      - id: system-boundaries
        name: System boundaries
        summary: Deciding where one component or service ends and another begins.
        description: >-
          Boundaries define what each part owns and how parts talk to each other. Good boundaries
          follow the domain and change rarely. Bad ones, often drawn too early, create constant
          cross-service coordination.
        related: [api-design, domain-language]
        resources: [fowler-bounded-context, fowler-monolith-first]
      - id: coupling
        name: Coupling and cohesion
        summary: How much parts depend on each other, and how well each part holds together.
        description: >-
          Low coupling means a change in one place rarely forces changes elsewhere. High cohesion
          means related things live together. Together they predict how expensive the next change
          will be.
        related: [modularity, dependency-management]
        resources: [fowler-monolith-first]
      - id: scalability
        name: Scalability
        summary: Handling more users, data or load without a rewrite.
        description: >-
          Scalability is about knowing where the limits are and how to move them when needed.
          Premature scaling wastes time on problems the product does not have. Knowing the likely
          bottlenecks lets a team scale just in time.
        related: [throughput, lifecycle-stages]
        resources: [system-design-primer, ddia]
      - id: technical-tradeoffs
        name: Technical tradeoffs
        summary: Weighing speed, cost, quality and flexibility in technical decisions.
        description: >-
          Every technical decision trades something for something else. Writing tradeoffs down, for
          example in decision records, makes them reviewable later. Product engineers weigh them
          against the product's stage and goals, not only technical taste.
        related: [tradeoffs, reversible-decisions]
        resources: [nygard-adr]

  - id: data-engineering
    name: Data engineering
    description: >-
      Designing, storing and moving data so it stays correct, fast to query and safe to
      change.
    related: [caching]
    resources: [use-the-index-luke, fowler-evodb, ddia]
    tools: [postgresql]
    skills:
      - id: data-modeling
        name: Data modeling
        summary: Designing the structure of data to fit the domain and its queries.
        description: >-
          The data model shapes what the product can do easily. A good model reflects the domain,
          enforces important rules and supports the main queries. It is one of the hardest things
          to change later, so it deserves thought upfront.
        related: [domain-language, databases]
        resources: [ddia]
      - id: sql
        name: SQL
        summary: Querying and shaping relational data.
        description: >-
          SQL remains the common language of data, from product databases to analytics warehouses.
          Product engineers use it to build features and to answer product questions without
          waiting for an analyst. Joins, aggregations and window functions cover most needs.
        related: [funnel-analysis, databases]
        resources: [use-the-index-luke]
      - id: databases
        name: Databases and persistence
        summary: Choosing and using storage systems that fit the data and access patterns.
        description: >-
          Relational databases cover most products well, with document, key-value and search
          stores for specific needs. Knowing indexes, transactions and query plans prevents most
          performance problems. Simple, boring storage choices are usually the right ones.
        related: [data-modeling, sql]
        resources: [use-the-index-luke, ddia]
        tools: [postgresql]
      - id: data-consistency
        name: Consistency
        summary: Keeping data correct when many things read and write at once.
        description: >-
          Consistency problems appear with concurrent writes, caches, replicas and distributed
          systems. Transactions, constraints and idempotency are the main tools. Users notice
          inconsistency as lost work or numbers that do not add up.
        related: [data-integrity, state-management]
        resources: [ddia]
      - id: schema-migrations
        name: Schema migrations
        summary: Changing the database structure safely while the product keeps running.
        description: >-
          Migrations evolve the schema in versioned steps. Safe migrations avoid locking tables and
          stay compatible with the code running before and after the deploy. Expand and contract
          patterns let you change data without downtime.
        related: [rollbacks, ci-cd]
        resources: [fowler-evodb, fowler-parallel-change]
      - id: data-integrity
        name: Data integrity
        summary: Making sure stored data is accurate, complete and valid.
        description: >-
          Integrity comes from constraints, validation, foreign keys and careful backfills. Bad data
          spreads into analytics, emails and decisions. It is much cheaper to prevent than to clean
          up later.
        related: [data-consistency, analytics-data-quality]
        resources: [fowler-evodb]

  - id: engineering-quality
    name: Engineering quality
    description: >-
      Practices that keep software correct as it changes: tests, reviews, debugging and
      steady improvement of the code.
    resources: [fowler-test-pyramid, google-code-review, refactoring-com]
    tools: [vitest, playwright]
    skills:
      - id: automated-testing
        name: Automated testing
        summary: Tests that run automatically and catch regressions early.
        description: >-
          Automated tests let a team change code with confidence. The useful ones test behavior,
          not implementation details, and run fast. Test-driven development is one way to make
          testing part of design rather than an afterthought.
        related: [integration-tests, acceptance-criteria]
        resources: [fowler-test-pyramid, kcd-testing-trophy, fowler-testing-culture]
        tools: [vitest]
      - id: integration-tests
        name: Integration tests
        summary: Tests that check components working together, including real databases or services.
        description: >-
          Integration tests catch problems that unit tests miss, at the boundaries between parts.
          They are slower but often give more confidence per test. Many teams find them the best
          value for typical product code.
        related: [automated-testing, end-to-end-tests]
        resources: [kcd-testing-trophy, fowler-test-pyramid]
      - id: end-to-end-tests
        name: End-to-end tests
        summary: Tests that drive the real product like a user would.
        description: >-
          End-to-end tests exercise the full stack through the interface. They are the closest to
          real use and the most fragile. A few covering critical paths, such as signup and payment,
          give the most value.
        related: [integration-tests, release-qa]
        resources: [fowler-test-pyramid]
        tools: [playwright]
      - id: code-review
        name: Code review
        summary: Reviewing changes to catch problems and share knowledge.
        description: >-
          Code review finds bugs, spreads knowledge and keeps standards consistent. Small changes
          get better reviews. With AI-generated code, reviewing well has become an even more
          important skill.
        related: [reviewing-generated-work, refactoring]
        resources: [google-code-review]
      - id: debugging
        name: Debugging
        summary: Finding the real cause of a problem systematically.
        description: >-
          Good debugging is a method: reproduce, form a hypothesis, test it, narrow down. Tools like
          debuggers, logs and bisecting help. The same habit of evidence over guessing applies to
          product problems.
        related: [root-cause-analysis, logging]
        resources: [jvns-debugging]
      - id: refactoring
        name: Refactoring
        summary: Improving code structure without changing its behavior.
        description: >-
          Refactoring keeps a codebase easy to change. It works best in small steps protected by
          tests, folded into feature work. Knowing when not to refactor matters too.
        related: [technical-debt, automated-testing]
        resources: [refactoring-com, fowler-tech-debt-quadrant]

  - id: performance-engineering
    name: Performance engineering
    description: >-
      Making the product fast where users notice, and keeping it fast as it grows.
    resources: [webdev-vitals, napkin-math, gregg-flame-graphs]
    tools: [lighthouse, k6]
    skills:
      - id: latency
        name: Latency
        summary: How long users wait for a response.
        description: >-
          Latency is what users feel as speed. Percentiles such as p95 matter more than averages,
          because slow requests are what people remember. Network, database and rendering each add
          their share.
        related: [interface-feedback, frontend-performance]
        resources: [napkin-math, webdev-vitals]
      - id: throughput
        name: Throughput
        summary: How much work a system can handle per unit of time.
        description: >-
          Throughput is about capacity: requests per second, jobs per minute. It sets how many users
          you can serve and at what cost. Load tests show where it breaks before users find out.
        related: [scalability, infrastructure-costs]
        resources: [napkin-math]
        tools: [k6]
      - id: profiling
        name: Profiling
        summary: Measuring where time and resources actually go.
        description: >-
          Profiling replaces guesses with measurements. CPU profiles, flame graphs, query plans and
          browser dev tools show the real bottleneck, which is rarely where you expected. Optimize
          only after profiling.
        related: [debugging, performance-monitoring]
        resources: [gregg-flame-graphs]
      - id: caching
        name: Caching
        summary: Storing results so repeated work is avoided.
        description: >-
          Caching can make a product dramatically faster and cheaper. It also introduces stale data
          and invalidation bugs. Knowing the cache layers, from the browser to the CDN to the
          database, helps you choose the simplest one that works.
        related: [data-consistency, latency]
        resources: [mdn-http-caching, webdev-http-cache]
      - id: performance-budgets
        name: Performance budgets
        summary: Limits on page weight, load time or latency that a team agrees not to exceed.
        description: >-
          A performance budget turns speed into a constraint that is checked automatically, often
          in CI. It stops slow creep, one dependency at a time. Budgets work best when tied to
          metrics users feel, such as Core Web Vitals.
        related: [ci-checks, frontend-performance]
        resources: [webdev-vitals]
        tools: [lighthouse]
      - id: frontend-performance
        name: Frontend performance
        summary: Fast loading and smooth interaction in the browser or app.
        description: >-
          Frontend performance covers bundle size, rendering, images, fonts and responsiveness to
          input. Core Web Vitals give a shared way to measure it. Slow interfaces lose users quietly,
          especially on cheaper phones.
        related: [latency, performance-budgets]
        resources: [webdev-top-cwv, webdev-optimize-lcp]
        tools: [lighthouse]
      - id: backend-performance
        name: Backend performance
        summary: Fast and efficient servers, queries and services.
        description: >-
          Backend performance comes from good queries and indexes, fewer round trips, efficient
          algorithms and doing work asynchronously. Most problems are a few slow queries. Fixing
          them often cuts infrastructure costs too.
        related: [databases, profiling]
        resources: [use-the-index-luke, gregg-flame-graphs]

  - id: security-engineering
    name: Security and privacy engineering
    description: >-
      Building products that protect users and their data, and knowing when to call in a
      specialist.
    resources: [owasp-top10, owasp-threat-modeling, owasp-authentication]
    tools: [semgrep]
    skills:
      - id: authentication
        name: Authentication
        summary: Verifying who a user is.
        description: >-
          Authentication covers passwords, sessions, tokens, single sign-on and passkeys. It is easy
          to get subtly wrong, so proven libraries and services are usually the right choice. Its
          design also affects signup friction.
        related: [signup-flow, authorization]
        resources: [owasp-authentication]
      - id: authorization
        name: Authorization
        summary: Controlling what each user is allowed to see and do.
        description: >-
          Authorization decides access to data and actions, through roles, permissions or
          ownership rules. Broken access control is one of the most common serious vulnerabilities.
          Checks belong on the server, close to the data.
        related: [authentication, collaboration-features]
        resources: [owasp-authorization]
      - id: threat-modeling
        name: Threat modeling
        summary: Thinking through how a system could be attacked before building it.
        description: >-
          Threat modeling asks what we are building, what can go wrong, and what we will do about
          it. A short session during design catches problems that are expensive to fix later. It
          scales from a whiteboard sketch to a formal review.
        related: [secure-coding, system-boundaries]
        resources: [owasp-threat-modeling]
      - id: secure-coding
        name: Secure coding
        summary: Writing code that avoids common vulnerabilities.
        description: >-
          Secure coding prevents injection, cross-site scripting, insecure deserialization and the
          rest of the OWASP list. Most of it comes down to validating input, encoding output and
          using safe defaults. Frameworks help, until you work around them.
        related: [threat-modeling, code-review]
        resources: [owasp-top10]
        tools: [semgrep]
      - id: data-protection
        name: Data protection
        summary: Protecting personal and sensitive data through its whole life.
        description: >-
          Data protection covers encryption, minimization, retention and access control for
          personal data. Collecting less is the strongest protection. It connects engineering
          practice to legal duties like GDPR.
        related: [privacy-obligations, privacy-by-design]
        resources: [owasp-crypto-storage]
      - id: secrets-management
        name: Secrets management
        summary: Handling API keys, passwords and certificates safely.
        description: >-
          Secrets belong in a secrets manager or environment configuration, never in code or logs.
          Rotation and limited scope reduce the damage when one leaks. Leaked keys in repositories
          are still one of the most common incidents.
        related: [environment-management, security-policies]
        resources: [owasp-secrets]
        tools: [infisical]

  - id: ai-engineering
    name: AI-native engineering
    description: >-
      Building product features on top of language models and agents, where behavior is
      probabilistic and must be measured rather than assumed.
    resources: [anthropic-effective-agents, hamel-evals, claude-prompt-engineering]
    tools: [langfuse, promptfoo]
    skills:
      - id: llm-integration
        name: LLM integration
        summary: Calling language models from a product reliably.
        description: >-
          Integrating an LLM means prompts, model choice, streaming, retries, timeouts and cost
          control. Prompts are code and deserve versioning and tests. The model is a dependency that
          changes, so the integration has to absorb that.
        related: [inference-costs, structured-outputs]
        resources: [claude-prompt-engineering, anthropic-effective-agents]
      - id: structured-outputs
        name: Structured outputs
        summary: Getting model responses in a reliable machine-readable format.
        description: >-
          Structured outputs constrain a model to a schema, such as JSON, so the product can use
          the result safely. They turn free text into data. Validation and fallbacks still matter
          when outputs are wrong but well formed.
        related: [llm-integration, tool-calling]
        resources: [claude-structured-outputs]
      - id: retrieval
        name: Retrieval (RAG)
        summary: Giving a model the right context from your own data.
        description: >-
          Retrieval-augmented generation finds relevant documents and adds them to the prompt. Answer
          quality depends mostly on retrieval quality: chunking, search and ranking. It has to be
          evaluated like any search system.
        related: [ai-evals, databases]
        resources: [anthropic-contextual-retrieval, anthropic-context-engineering]
      - id: ai-agents
        name: Agents
        summary: Systems where a model plans and takes multiple steps with tools.
        description: >-
          An agent loops: it decides, calls tools, looks at results and continues. Agents can do
          open-ended tasks but are harder to predict and test. Clear tools, limits and human
          checkpoints keep them useful.
        related: [tool-calling, human-oversight]
        resources: [anthropic-effective-agents, anthropic-context-engineering]
      - id: tool-calling
        name: Tool calling
        summary: Letting a model call functions and APIs in your product.
        description: >-
          Tool calling lets a model request actions such as searching, creating records or calling
          APIs. Tool design matters as much as prompt design: clear names, narrow scope and good
          errors. Every tool is also a permission to think about.
        related: [api-design, mcp]
        resources: [claude-tool-use, anthropic-writing-tools]
      - id: mcp
        name: Model Context Protocol
        summary: An open standard for connecting AI applications to tools and data.
        description: >-
          MCP defines how AI clients discover and call tools and resources from servers. It lets
          one integration work across many AI applications. Building an MCP server is a growing way
          to make a product usable by agents.
        related: [tool-calling, developer-experience]
        resources: [mcp-intro]
      - id: ai-evals
        name: Evals and datasets
        summary: Measuring AI behavior with test sets and repeatable evaluation runs.
        description: >-
          Evals replace "it looked fine" with numbers. A dataset of real cases, a grading method,
          which may use code, people or another model, and repeatable runs let you compare prompts
          and models. They are the AI version of automated tests.
        related: [automated-testing, llm-observability]
        resources: [hamel-evals, hamel-field-guide, hamel-llm-judge, hamel-evals-faq]
        tools: [promptfoo, langfuse]
      - id: llm-observability
        name: AI observability
        summary: Tracing and inspecting what models and agents actually did in production.
        description: >-
          AI observability records prompts, outputs, tool calls, latency and cost for each request.
          Traces show why an agent went wrong. Production traces are also the best source of new
          eval cases.
        related: [tracing, ai-evals]
        resources: [hamel-field-guide, otel-llm-blog]
        tools: [langfuse]
      - id: ai-guardrails
        name: Guardrails
        summary: Checks that keep AI output safe, on topic and within policy.
        description: >-
          Guardrails validate inputs and outputs, block unsafe content and limit what an agent can
          do. They range from simple rules to classifier models. They matter most where AI output
          reaches users or takes actions directly.
        related: [user-safety, human-oversight]
        resources: [owasp-llm-top10, owasp-prompt-injection, willison-prompt-injection]

  - id: developer-experience
    name: Developer experience
    description: >-
      The tools and workflows that make engineers productive, for your own team or for the
      developers who use your product.
    resources: [diataxis, fowler-ci, fowler-ship-show-ask]
    tools: [github-actions, renovate]
    skills:
      - id: internal-tooling
        name: Internal tooling
        summary: Tools built for the team's own use, such as admin panels and scripts.
        description: >-
          Internal tools save hours of support and operations work. Admin panels, data fixes and
          debug views are product work with your colleagues as users. They often pay back faster
          than customer features.
        related: [support-workflows, engineering-automation]
        resources: [twelve-factor]
      - id: developer-workflows
        name: Developer workflows
        summary: How code moves from an idea to production in a team.
        description: >-
          Developer workflows cover branching, local setup, reviews and releases. Friction there
          slows every feature. Fast feedback loops, such as quick local runs and fast tests, make
          the biggest difference.
        related: [ci-cd, code-review]
        resources: [fowler-ship-show-ask, trunk-based, dora-trunk-based]
      - id: developer-docs
        name: Developer documentation
        summary: Docs that help engineers understand and use code, APIs and systems.
        description: >-
          Developer docs include READMEs, API references, guides and decision records. Good ones are
          close to the code and kept current. They now also serve AI agents working in the
          codebase.
        related: [documentation-ux, technical-writing]
        resources: [diataxis, nygard-adr]
      - id: build-systems
        name: Build systems
        summary: The tooling that compiles, bundles and packages code.
        description: >-
          Build systems turn source code into something that runs. Slow or flaky builds waste time
          every day. Understanding the build helps with performance, caching and debugging strange
          errors.
        related: [ci-cd, frontend-performance]
        resources: [fowler-ci]
      - id: engineering-automation
        name: Engineering automation
        summary: Automating repetitive engineering tasks.
        description: >-
          Automation covers code generation, dependency updates, release notes, environment setup
          and more. A task done by hand every week is a good candidate. Scripts and bots free
          attention for product work.
        related: [workflow-automation, dependency-updates]
        tools: [renovate, github-actions]
      - id: ci-checks
        name: CI quality checks
        summary: Automated checks that run on every change.
        description: >-
          CI checks run tests, linters, type checks, security scans and budgets on every pull
          request. They catch problems before review. Keeping them fast and reliable matters as
          much as having them.
        related: [ci-cd, performance-budgets]
        resources: [fowler-ci]
        tools: [github-actions]
