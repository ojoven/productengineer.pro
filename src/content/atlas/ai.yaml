# Territory: AI

id: ai
order: 11
name: AI
tagline: Use AI and build AI products
question: How do we use AI effectively and build products whose behaviour depends on it?
description: >-
  AI covers using models and agents in your work and building products that depend on them.
  It includes giving models useful context, connecting tools and knowledge, evaluating behaviour
  and keeping people in control. Probabilistic outputs require explicit checks and reliable
  recovery when something goes wrong. General software engineering, product judgment and
  verification connect this territory to the rest of the atlas.
expected: >-
  Delegate bounded work to AI, review its results and build model-powered features with
  measurable quality, clear permissions and useful fallbacks.
capabilities:
  - id: ai-engineering
    name: AI engineering
    previousPaths: [/atlas/engineering/ai-engineering/]
    description: >-
      Building product features on top of language models and agents, where behavior is
      probabilistic and must be measured rather than assumed.
    resources: [anthropic-effective-agents, hamel-evals, claude-prompt-engineering]
    tools: [langfuse, promptfoo]
    skills:
      - id: llm-integration
        previousPaths: [/atlas/engineering/ai-engineering/llm-integration/]
        focus: [systems, ai]
        name: LLM integration
        summary: Calling language models from a product reliably.
        description: >-
          Integrating an LLM means prompts, model choice, streaming, retries, timeouts and cost
          control. Prompts are code and deserve versioning and tests. The model is a dependency that
          changes, so the integration has to absorb that.
        related: [inference-costs, structured-outputs]
        resources: [claude-prompt-engineering, anthropic-effective-agents]
        technicalLeverage: Wrap model calls behind a stable interface with timeouts, bounded
          retries, streaming and measurable cost, so a dependency failure does not become a broken
          journey.
        evidence:
          practice: Build a small AI feature with a useful fallback and exercise provider failures.
          artifact: A working integration with failure tests and latency and cost measurements.
          checks:
            - Timeouts, rate limits and invalid output have defined behavior.
            - Model choice is justified against the actual task and a simpler baseline.

      - id: structured-outputs
        previousPaths: [/atlas/engineering/ai-engineering/structured-outputs/]
        focus: [systems, ai]
        name: Structured outputs
        summary: Getting model responses in a reliable machine-readable format.
        description: >-
          Structured outputs constrain a model to a schema, such as JSON, so the product can use
          the result safely. They turn free text into data. Validation and fallbacks still matter
          when outputs are wrong but well formed.
        related: [llm-integration, tool-calling]
        resources: [claude-structured-outputs]
        technicalLeverage: Define schemas, validate responses at the boundary and check business
          constraints before generated data reaches application state.
        evidence:
          practice: Extract structured records from varied documents, including missing and
            contradictory information.
          artifact: A schema, validation code and a dataset of accepted, rejected and uncertain results.
          checks:
            - Well-formed but factually wrong output is detected by separate checks.
            - Refusals and incomplete output do not silently become valid records.

      - id: retrieval
        previousPaths: [/atlas/engineering/ai-engineering/retrieval/]
        focus: [systems, ai]
        name: Retrieval (RAG)
        summary: Giving a model the right context from your own data.
        description: >-
          Retrieval-augmented generation finds relevant documents and adds them to the prompt. Answer
          quality depends mostly on retrieval quality: chunking, search and ranking. It has to be
          evaluated like any search system.
        related: [ai-evals, databases]
        resources: [anthropic-contextual-retrieval, anthropic-context-engineering]
        technicalLeverage: Build ingestion, chunking, embeddings and search, then evaluate retrieval
          separately from answer generation to locate the actual failure.
        evidence:
          practice: Build a source-linked answer feature for a small, permissioned knowledge base.
          artifact: A retrieval benchmark with expected sources, grounded answers and examples of abstention.
          checks:
            - Access controls apply before documents reach the model.
            - Missing evidence, stale documents and conflicting sources are tested.

      - id: ai-agents
        previousPaths: [/atlas/engineering/ai-engineering/ai-agents/]
        focus: [systems, ai]
        name: Agents
        summary: Systems where a model plans and takes multiple steps with tools.
        description: >-
          An agent loops: it decides, calls tools, looks at results and continues. Agents can do
          open-ended tasks but are harder to predict and test. Clear tools, limits and human
          checkpoints keep them useful.
        related: [tool-calling, human-oversight]
        resources: [anthropic-effective-agents, anthropic-context-engineering]
        technicalLeverage: Implement tool boundaries, execution state, budgets and recovery so agent
          behavior can be inspected and stopped.
        evidence:
          practice: Build an agent for one bounded workflow and compare it with a fixed sequence of steps.
          artifact: An agent prototype, execution traces and a comparison of success, cost and failure
            recovery.
          checks:
            - Actions are scoped and consequential steps require appropriate human control.
            - Loops terminate and partial failures can be recovered without duplicate actions.

      - id: tool-calling
        previousPaths: [/atlas/engineering/ai-engineering/tool-calling/]
        focus: [systems, ai]
        name: Tool calling
        summary: Letting a model call functions and APIs in your product.
        description: >-
          Tool calling lets a model request actions such as searching, creating records or calling
          APIs. Tool design matters as much as prompt design: clear names, narrow scope and good
          errors. Every tool is also a permission to think about.
        related: [api-design, mcp]
        resources: [claude-tool-use, anthropic-writing-tools]
        technicalLeverage: Enforce authorization, validate arguments and design idempotent
          operations outside the model’s reasoning loop.
        evidence:
          practice: Expose a small read tool and a reversible write tool to an assistant.
          artifact: Tool contracts and tests for bad arguments, denied permissions and repeated calls.
          checks:
            - The server checks authorization for every operation.
            - Tool errors give enough information to recover without exposing sensitive data.

      - id: mcp
        previousPaths: [/atlas/engineering/ai-engineering/mcp/]
        focus: [systems, ai]
        name: Model Context Protocol
        summary: An open standard for connecting AI applications to tools and data.
        description: >-
          MCP defines how AI clients discover and call tools and resources from servers. It lets
          one integration work across many AI applications. Building an MCP server is a growing way
          to make a product usable by agents.
        related: [tool-calling, developer-experience]
        resources: [mcp-intro]
        technicalLeverage: Implement an interoperable tool interface while keeping authentication,
          authorization and auditability in the host application.
        evidence:
          practice: Expose a bounded product workflow through an MCP server and exercise it from a
            compatible client.
          artifact: A documented server with integration checks for discovery, calls and access boundaries.
          checks:
            - Invalid and unauthorized calls fail predictably.
            - The integration grants only the access needed for the workflow.

      - id: ai-evals
        previousPaths: [/atlas/engineering/ai-engineering/ai-evals/]
        focus: [ai, systems, evidence]
        name: Evals and datasets
        summary: Measuring AI behavior with test sets and repeatable evaluation runs.
        description: >-
          Evals replace "it looked fine" with numbers. A dataset of real cases, a grading method,
          which may use code, people or another model, and repeatable runs let you compare prompts
          and models. They are the AI version of automated tests.
        related: [automated-testing, llm-observability]
        resources: [hamel-evals, hamel-field-guide, hamel-llm-judge, hamel-evals-faq]
        tools: [promptfoo, langfuse]
        technicalLeverage: Build repeatable evaluation pipelines, version datasets and turn
          production failures into regression cases.
        evidence:
          practice: Evaluate a product task with a labeled dataset, representative edge cases and an
            explicit acceptance threshold.
          artifact: An evaluation suite with human-reviewed labels, baseline results and a release decision.
          checks:
            - Report results by important failure type, not just an average score.
            - Model-based graders are checked against independent human judgments.

      - id: llm-observability
        previousPaths: [/atlas/engineering/ai-engineering/llm-observability/]
        focus: [ai, systems, evidence]
        name: AI observability
        summary: Tracing and inspecting what models and agents actually did in production.
        description: >-
          AI observability records prompts, outputs, tool calls, latency and cost for each request.
          Traces show why an agent went wrong. Production traces are also the best source of new
          eval cases.
        related: [tracing, ai-evals]
        resources: [hamel-field-guide, otel-llm-blog]
        tools: [langfuse]
        technicalLeverage: Connect model and tool traces to product outcomes, with redaction and
          retention controls for sensitive inputs.
        evidence:
          practice: Instrument an AI workflow and diagnose a failing task from its trace.
          artifact: A trace view and a diagnosis linking retrieval, generation or tool errors to the
            user outcome.
          checks:
            - Latency, cost and task failure can be inspected together.
            - Trace access and stored content respect data boundaries.

      - id: ai-guardrails
        previousPaths: [/atlas/engineering/ai-engineering/ai-guardrails/]
        focus: [ai, systems]
        name: Guardrails
        summary: Checks that keep AI output safe, on topic and within policy.
        description: >-
          Guardrails validate inputs and outputs, block unsafe content and limit what an agent can
          do. They range from simple rules to classifier models. They matter most where AI output
          reaches users or takes actions directly.
        related: [user-safety, human-oversight]
        resources: [owasp-llm-top10, owasp-prompt-injection, willison-prompt-injection]
        technicalLeverage: Enforce permissions and business rules in code, then test how input and
          output checks behave when a model is manipulated.
        evidence:
          practice: Threat-model an AI feature and test malicious instructions embedded in user input
            and retrieved documents.
          artifact: A threat model, adversarial cases and evidence that unauthorized actions remain blocked.
          checks:
            - Guardrails are treated as partial controls, not a guarantee of safety.
            - Authorization does not depend on the model following a prompt.

      - id: llm-fundamentals
        previousPaths: [/atlas/engineering/ai-engineering/llm-fundamentals/]
        focus: [systems, ai]
        name: AI and language model fundamentals
        summary: Understanding learned behavior, language models and their practical limits.
        description: >-
          Machine learning fits patterns from examples rather than specifying every rule by hand.
          Language models generate tokens from context, which can produce useful answers as well as
          plausible mistakes. Understanding training, inference, embeddings and context limits helps
          you choose between a model, a simpler rule or a human decision.
        related: [llm-integration, ai-evals, retrieval]
        resources: [google-llm-intro]
        technicalLeverage: Run small experiments that separate training from inference, expose token
          and context limits, and compare a model with a deterministic baseline.
        evidence:
          practice: Compare a language model with a rule-based solution on a bounded classification
            task, including unfamiliar and ambiguous inputs.
          artifact: A reproducible notebook or script and a short decision on whether a model is justified.
          checks:
            - Explain what is learned, what is provided at inference and where errors arise.
            - Report failures as well as successful examples; avoid claiming general reliability
              from a small sample.

      - id: prompt-context-engineering
        previousPaths: [/atlas/engineering/ai-engineering/prompt-context-engineering/]
        focus: [systems, ai]
        name: Prompt and context engineering
        summary: Giving a model the instructions and information it needs for a bounded task.
        description: >-
          Define the outcome, constraints, examples and output format, then supply relevant context
          within a finite budget. Keep instructions separate from untrusted documents and tool results.
          Version the configuration and compare changes on representative cases instead of judging
          a single convincing response.
        related: [structured-outputs, retrieval, ai-evals, delegating-to-agents]
        resources: [claude-prompt-engineering, anthropic-context-engineering]
        technicalLeverage: Version prompts with code, assemble context from authorized sources and
          run comparisons automatically when instructions or models change.
        evidence:
          practice: Compare two context strategies on a fixed set of representative tasks, including
            irrelevant and adversarial documents.
          artifact: Versioned prompts, recorded inputs and an evaluation of quality, context size and
            failure modes.
          checks:
            - Examples used for development are separated from final evaluation cases.
            - Untrusted source text cannot grant tools new permissions.

  - id: ai-assisted-work
    name: AI-assisted work
    previousPaths: [/atlas/cross-cutting/ai-assisted-work/]
    description: >-
      Using AI tools and agents to do more, while keeping responsibility for the result.
    resources: [willison-llms-for-code, claude-code-best-practices, anthropic-effective-agents]
    tools: [aider]
    skills:
      - id: delegating-to-agents
        previousPaths: [/atlas/cross-cutting/ai-assisted-work/delegating-to-agents/]
        focus: [ai, people]
        name: Delegating to agents
        summary: Handing tasks to AI agents with clear goals and context.
        description: >-
          Delegating well means a clear goal, the right context, constraints and a way to check the
          result. Good task descriptions look a lot like good tickets for people. It is quickly
          becoming a core engineering skill.
        related: [ai-agents, technical-writing]
        resources: [claude-code-best-practices, anthropic-effective-agents]
        tools: [aider]
        aiLeverage:
          workflow: Define the outcome, repository context, constraints and acceptance checks for a
            bounded agent task.
          limitations: Agents can broaden scope, take unauthorized actions or optimize for passing
            checks without meeting the real need.
          verification: Review the resulting artifacts and execute independent acceptance checks
            before accepting the work.
        technicalLeverage: Give agents reproducible environments, narrow tools and automated checks,
          and inspect their implementation decisions.
        evidence:
          practice: Delegate one reversible task and evaluate the result against a written brief.
          artifact: The brief, execution record, reviewed result and a note on what needed human correction.
          checks:
            - Permissions and stopping conditions are explicit.
            - A human can explain and maintain the accepted result.

      - id: reviewing-generated-work
        previousPaths: [/atlas/cross-cutting/ai-assisted-work/reviewing-generated-work/]
        focus: [ai, evidence, systems]
        name: Reviewing generated work
        summary: Critically checking code and content produced by AI.
        description: >-
          AI output can look right and be subtly wrong. Reviewing it needs the same care as a
          colleague's work, and more care where you lack expertise. Small, focused changes are
          easier to review.
        related: [code-review, verification]
        resources: [willison-llms-for-code, google-code-review]

      - id: human-oversight
        previousPaths: [/atlas/cross-cutting/ai-assisted-work/human-oversight/]
        focus: [ai, people]
        name: Human oversight
        summary: Keeping people in control of important AI-driven actions.
        description: >-
          Human oversight puts review points where AI decisions have real consequences. It requires
          interfaces that show what the AI did and why. The right level depends on the cost of a
          mistake.
        related: [ai-guardrails, ai-agents]
        resources: [hax-guidelines, pair-guidebook]
        technicalLeverage: Build review queues, action previews, audit logs and interruption
          controls so human authority is enforced by the system.
        evidence:
          practice: Design a human checkpoint for an AI workflow that can modify user data.
          artifact: A working approval and recovery flow with a record of who authorized each action.
          checks:
            - A reviewer can inspect the exact action and relevant evidence.
            - Rejection, timeout and interruption prevent the action from proceeding.
