work:
  - title: A launch with no second take
    context: Majestic · Super Bowl campaign
    when: Two months of work
    text: The air date was fixed. Millions were watching, and the traffic wave would start seconds after the ad.
    decisions:
      - Protect the origin. CloudFront and S3 absorbed static traffic before it reached dynamic services.
      - Bound the dynamic work. API Gateway and small Lambda handlers kept dynamic requests apart from static delivery, so each could scale and fail on its own.
      - Watch the launch as it happened. Structured logs and request IDs let us follow errors and latency while the campaign was live.
    skills: [operational-readiness, caching, system-boundaries, scalability, logging, launch-telemetry]

